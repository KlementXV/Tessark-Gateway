apiVersion: v1
kind: Pod
metadata:
  name: {{ include "tessark-gateway.fullname" . }}-test-connection
  labels:
    {{- include "tessark-gateway.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  {{- include "tessark-gateway.pullSecrets" (dict "root" . "local" .Values.imagePullSecrets) | nindent 2 }}
  restartPolicy: Never
  containers:
    - name: wget
      image: {{ include "tessark-gateway.appImage" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      # Liveness only, deliberately — `helm test` runs whenever an operator wants to poke the
      # release, including right after a fresh install before the migrate/seed hooks have
      # necessarily settled; /api/ready failing at that exact moment is not a reason to report
      # a broken chart.
      command:
        - node
        - -e
        - |
          fetch('http://{{ include "tessark-gateway.fullname" . }}:{{ .Values.service.port }}/api/health')
            .then((res) => { if (!res.ok) throw new Error('status ' + res.status); console.log('ok'); })
            .catch((err) => { console.error(err); process.exit(1); })
