{{/*
The embedded Postgres's own credentials — separate from the app Secret (templates/secret.yaml)
because the StatefulSet and the app read different key names (POSTGRES_PASSWORD vs a full
DATABASE_URL) and because this one must survive independently: templates/secret.yaml's
DATABASE_URL is *derived* from this Secret's password via `lookup` (see
tessark-gateway.databaseUrl in _helpers.tpl), so this one has to exist and keep its value
first.
*/}}
{{- if eq .Values.database.mode "embedded" }}
{{- $secretName := include "tessark-gateway.embeddedDbSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $password := "" }}
{{- if and $existing (hasKey $existing.data "password") }}
{{- $password = index $existing.data "password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "tessark-gateway.labels" . | nindent 4 }}
  annotations:
    # Survives `helm uninstall` (decision D8) — see templates/secret.yaml and NOTES.txt.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  username: tessark
  password: {{ $password | quote }}
  database: tessark_gateway
{{- end }}
