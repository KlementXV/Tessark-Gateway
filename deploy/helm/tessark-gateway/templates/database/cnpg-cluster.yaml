{{/*
database.mode: cnpg — HA via CloudNativePG. The operator is a documented prerequisite, not a
dependency this chart packages (CRDs and controllers are cluster-scoped and shouldn't be
owned by an application release). Fails at render time with a clear message when the operator
isn't installed, rather than producing a Cluster resource that never reconciles and a
Deployment that starts against a database URL nothing will ever answer on.
*/}}
{{- if eq .Values.database.mode "cnpg" }}
{{- if not (.Capabilities.APIVersions.Has "postgresql.cnpg.io/v1/Cluster") }}
{{- fail "database.mode=cnpg requires the CloudNativePG operator (CRD postgresql.cnpg.io/v1/Cluster not found in this cluster) — install it first: https://cloudnative-pg.io/documentation/current/installation_upgrade/" }}
{{- end }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "tessark-gateway.fullname" . }}
  {{- if (dig "keepCluster" true .Values.database.cnpg) }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
  labels:
    {{- include "tessark-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  instances: {{ .Values.database.cnpg.instances }}
  {{- with .Values.database.cnpg.imageName }}
  imageName: {{ include "tessark-gateway.imageRef" (dict "root" $ "image" .) | quote }}
  {{- end }}
  {{- include "tessark-gateway.pullSecrets" (dict "root" . "local" .Values.database.cnpg.imagePullSecrets) | nindent 2 }}
  enableSuperuserAccess: false
  {{- with .Values.database.cnpg.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.database.cnpg.affinity }}
  affinity:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.database.cnpg.parameters }}
  postgresql:
    parameters:
      {{- toYaml . | nindent 6 }}
  {{- end }}
  bootstrap:
    initdb:
      database: app
      owner: app
  storage:
    size: {{ .Values.database.cnpg.storageSize | quote }}
    {{- with .Values.database.cnpg.storageClassName }}
    storageClass: {{ . | quote }}
    {{- end }}
{{- end }}
