{{- $ns := default .Release.Namespace .Values.builds.namespace -}}
{{- $sa := default (printf "%s-build-runner" (include "tessark-gateway.fullname" .)) .Values.builds.serviceAccount -}}
{{- if and .Values.builds.enabled (not .Values.config.k8sEnabled) -}}
{{- fail "builds.enabled requires config.k8sEnabled=true" -}}
{{- end -}}
{{- if and .Values.builds.enabled (not .Values.builds.runnerImage) -}}
{{- fail "builds.runnerImage must be set to the published runner image pinned by digest" -}}
{{- end -}}
{{- if and .Values.builds.namespace (ne .Values.builds.namespace .Release.Namespace) }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  annotations:
    helm.sh/resource-policy: keep
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ include "tessark-gateway.fullname" . }}-builds
  namespace: {{ $ns }}
spec:
  hard:
    pods: {{ .Values.builds.maxActivePods | quote }}
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  namespace: {{ $ns }}
automountServiceAccountToken: false
{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "tessark-gateway.fullname" . }}-build-claim
  namespace: {{ $ns }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "tessark-gateway.fullname" . }}-build-claim
  namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "tessark-gateway.fullname" . }}-build-claim
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $ns }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "tessark-gateway.fullname" . }}-build-manager
  namespace: {{ $ns }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["create", "get", "list", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "tessark-gateway.fullname" . }}-build-manager
  namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "tessark-gateway.fullname" . }}-build-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "tessark-gateway.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if .Values.builds.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tessark-gateway.fullname" . }}-builds
  namespace: {{ $ns }}
spec:
  podSelector:
    matchExpressions:
      - key: tessark.io/build-id
        operator: Exists
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: {{ .Values.builds.networkPolicy.egress | toJson }}
{{- end }}
