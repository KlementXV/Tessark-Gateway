{{/*
Optional, disabled by default. Egress is left open: registries/clusters are admin-configured
Harbor instances that can live anywhere (in-cluster, on-prem, another cloud), and the
Kubernetes API server address varies by cluster — a NetworkPolicy narrow enough to enumerate
those destinations up front would need per-install tuning this chart has no way to infer.
Ingress is scoped to the app's own port from anywhere in the namespace/cluster, which is the
one thing safe to assume.
*/}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tessark-gateway.fullname" . }}
  labels:
    {{- include "tessark-gateway.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "tessark-gateway.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: http
          protocol: TCP
{{- end }}
