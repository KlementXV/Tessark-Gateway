{{/*
Skipped entirely when existingSecret is set — installations managing their own secrets
(External Secrets, Vault, sealed-secrets, ...) must supply a Secret with the same keys this
template would otherwise produce (DATABASE_URL unless database.mode is cnpg or external with
its own existingSecret, AUTH_SECRET, GATEWAY_SECRET_KEY, and optionally
GATEWAY_ADMIN_USERNAME/PASSWORD/GATEWAY_SEED_USERS/GATEWAY_SEED_SOURCES for the first-run seed,
OIDC_CLIENT_SECRET when single sign-on is enabled, NOTIFICATIONS_WEBHOOK_URL when the outgoing
webhook is used).
*/}}
{{- if not .Values.existingSecret }}
{{- $secretName := include "tessark-gateway.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $existingAuthSecret := "" }}
{{- $existingSecretKey := "" }}
{{- if $existing }}
{{- if hasKey $existing.data "AUTH_SECRET" }}
{{- $existingAuthSecret = index $existing.data "AUTH_SECRET" | b64dec }}
{{- end }}
{{- if hasKey $existing.data "GATEWAY_SECRET_KEY" }}
{{- $existingSecretKey = index $existing.data "GATEWAY_SECRET_KEY" | b64dec }}
{{- end }}
{{- end }}
{{/*
AUTH_SECRET: generated once, then preserved across every upgrade via `lookup` — regenerating
it on every `helm upgrade` would silently sign every session out.
*/}}
{{- $authSecret := $existingAuthSecret | default (randAlphaNum 32) }}
{{/*
GATEWAY_SECRET_KEY: never regenerated once it exists — its loss/rotation makes every stored
registry/robot credential permanently unreadable (src/lib/crypto.ts). An explicit
values.secretKey that *disagrees* with what's already stored is refused outright rather than
silently applied: accepting it would overwrite the key protecting every credential already in
the database with a different one, with the exact same effect as losing it.
*/}}
{{- $gatewaySecretKey := "" }}
{{- if $existingSecretKey }}
{{- if and .Values.secretKey (ne .Values.secretKey $existingSecretKey) }}
{{- fail "values.secretKey does not match the GATEWAY_SECRET_KEY already stored in this release's Secret. Overwriting it would make every credential encrypted with the old key permanently unreadable. Remove secretKey from values (to keep the stored key) or confirm this is an intentional key migration and update the Secret directly." }}
{{- end }}
{{- $gatewaySecretKey = $existingSecretKey }}
{{- else }}
{{- $gatewaySecretKey = .Values.secretKey | default (randAlphaNum 32) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "tessark-gateway.labels" . | nindent 4 }}
  annotations:
    # Survives `helm uninstall` (decision D8) — losing this Secret alongside the database is
    # the one mistake this chart cannot let a careless uninstall make. See NOTES.txt for the
    # deliberate-deletion procedure.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- if or (eq .Values.database.mode "embedded") (and (eq .Values.database.mode "external") (not .Values.database.external.existingSecret)) }}
  DATABASE_URL: {{ include "tessark-gateway.databaseUrl" . | quote }}
  {{- end }}
  AUTH_SECRET: {{ $authSecret | quote }}
  GATEWAY_SECRET_KEY: {{ $gatewaySecretKey | quote }}
  {{- if .Values.auth.adminUsername }}
  GATEWAY_ADMIN_USERNAME: {{ .Values.auth.adminUsername | quote }}
  {{- end }}
  {{- if .Values.auth.adminPassword }}
  GATEWAY_ADMIN_PASSWORD: {{ .Values.auth.adminPassword | quote }}
  {{- end }}
  {{- if .Values.auth.seedUsers }}
  GATEWAY_SEED_USERS: {{ .Values.auth.seedUsers | toJson | quote }}
  {{- end }}
  {{- if .Values.seedSources }}
  GATEWAY_SEED_SOURCES: {{ .Values.seedSources | toJson | quote }}
  {{- end }}
  {{- if and .Values.oidc.enabled .Values.oidc.clientSecret }}
  {{/*
  Like the webhook URL: a credential that comes from values every time, never generated and
  never preserved by lookup. Rotating it in the identity provider and in values is all that a
  rotation takes — nothing already stored in the database depends on it.
  */}}
  OIDC_CLIENT_SECRET: {{ .Values.oidc.clientSecret | quote }}
  {{- end }}
  {{- if .Values.notifications.webhookUrl }}
  {{/*
  In the Secret rather than the ConfigMap: a Slack/Teams incoming-webhook URL is a bearer
  credential — it is unguessable by design and anyone holding it can post to the channel.
  Unlike AUTH_SECRET and GATEWAY_SECRET_KEY it is never generated and never preserved by
  lookup: it comes from values every time, and clearing it simply turns the webhook off.
  */}}
  NOTIFICATIONS_WEBHOOK_URL: {{ .Values.notifications.webhookUrl | quote }}
  {{- end }}
{{- end }}
