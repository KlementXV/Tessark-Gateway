{{- if and (include "tessark-gateway.dexEnabled" .) (not .Values.identity.dex.existingSecret) }}
{{/*
The Gateway's client secret at Dex lives here and only here: the Gateway reads it from this Secret
(templates/deployment.yaml) instead of receiving its own copy, because two templates each calling
randAlphaNum would disagree. Generated once, then preserved across upgrades via `lookup`.
*/}}
{{- $name := include "tessark-gateway.dexName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $clientSecret := .Values.identity.dex.clientSecret }}
{{- if not $clientSecret }}
{{- if and $existing (hasKey $existing.data "GATEWAY_CLIENT_SECRET") }}
{{- $clientSecret = index $existing.data "GATEWAY_CLIENT_SECRET" | b64dec }}
{{- else }}
{{- $clientSecret = randAlphaNum 48 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "tessark-gateway.dexLabels" . | nindent 4 }}
type: Opaque
stringData:
  GATEWAY_CLIENT_SECRET: {{ $clientSecret | quote }}
  {{- range $key, $value := .Values.identity.dex.env }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
{{- end }}
