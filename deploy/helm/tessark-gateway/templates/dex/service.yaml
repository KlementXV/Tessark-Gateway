{{- if include "tessark-gateway.dexEnabled" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tessark-gateway.dexName" . }}
  labels:
    {{- include "tessark-gateway.dexLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "tessark-gateway.dexSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.identity.dex.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
