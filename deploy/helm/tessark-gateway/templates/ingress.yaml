{{/*
Generic on purpose (decision D6): no default ingressClassName, no controller-specific
annotations pre-filled. Everything comes from values.yaml — a Traefik or nginx-specific
default here would silently do the wrong thing on any other controller.
*/}}
{{- if .Values.ingress.enabled }}
{{- $dexRoute := include "tessark-gateway.dexRoute" . | fromJson }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "tessark-gateway.fullname" . }}
  labels:
    {{- include "tessark-gateway.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.ingressClassName }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- if and $dexRoute.host (eq $dexRoute.host .host) }}
          # The embedded Dex, on the Gateway's own host: browsers and Gateway pods reach the
          # issuer at the same URL, which Dex requires (it has no separate internal address).
          - path: {{ $dexRoute.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "tessark-gateway.dexName" $ }}
                port:
                  number: {{ $.Values.identity.dex.service.port }}
          {{- end }}
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "tessark-gateway.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
