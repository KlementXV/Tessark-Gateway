# Local dev database only — not used in production (the Helm chart owns Postgres there,
# see docs/plan-kubernetes-helm.md §7/§10). Start with: docker compose -f docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tessark
      POSTGRES_PASSWORD: tessark
      POSTGRES_DB: tessark_gateway
    ports:
      - "5432:5432"
    volumes:
      - tessark-gateway-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tessark -d tessark_gateway"]
      interval: 5s
      timeout: 3s
      retries: 10


volumes:
  tessark-gateway-postgres:
